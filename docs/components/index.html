<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Effects · Baseplate</title>
<meta name="description" content="600 safety-scanned Creator Store effects, each with an agent name and description so your AI finds the right one in one search.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --stud-blue:#1F4BFF;
  --stud-blue-deep:#1436C4;
  --ink:#111111;
  --ink-raised:#1B1B1A;
  --ring:#2A2A28;
  --plate:#F4F2EC;
  --stone:#55534E;
  --stone-light:#B9B6AE;
  --seam:#DEDBD2;
  --white:#FFFFFF;
  --ease:cubic-bezier(0.22, 1, 0.36, 1);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--stud-blue);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--seam)}
.top-in{max-width:1400px;margin:0 auto;height:60px;padding:0 24px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:19px;letter-spacing:-.045em}
.logo svg{width:20px;height:20px}
.top nav{display:flex;gap:4px;font-size:14px;font-weight:500}
.top nav a{padding:7px 12px;border-radius:999px;color:var(--stone)}
.top nav a:hover{color:var(--ink);background:var(--plate)}
.top nav a.on{color:var(--ink)}

/* layout */
.layout{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;padding:0 24px}
.side{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:32px 0 48px}
.side h4{margin:0 0 6px;padding:0 10px;font-size:13px;font-weight:600;color:var(--ink)}
.side ul{list-style:none;margin:0 0 16px;padding:0}
.side h5{margin:10px 0 2px;padding:0 10px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--stone-light)}
.filter{width:100%;height:44px;padding:0 16px;border:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--seam);font:inherit;font-size:15px;margin-bottom:8px;background:var(--white);color:var(--ink)}
.filter:focus{outline:none;box-shadow:inset 0 0 0 2px var(--stud-blue)}
.group[hidden],.card[hidden]{display:none}
.side a{display:block;padding:5px 10px;border-radius:8px;font-size:14px;color:var(--stone)}
.side a:hover{color:var(--ink);background:var(--plate)}
.side a.on{color:var(--ink);font-weight:600;background:var(--plate)}
main{padding:40px 0 96px;min-width:0;max-width:820px}

.crumb{font-size:14px;color:var(--stone);margin-bottom:10px}
h1{font-size:36px;line-height:1.1;letter-spacing:-.04em;font-weight:600;margin:0 0 10px}
.lead{font-size:18px;color:var(--stone);margin:0 0 32px}
h2{font-size:22px;letter-spacing:-.03em;font-weight:600;margin:48px 0 14px;padding-bottom:10px;border-bottom:1px solid var(--seam)}
h3{font-size:17px;font-weight:600;margin:28px 0 8px}
p{margin:0 0 14px}
main ol,main ul{padding-left:22px;margin:0 0 14px}
main li{margin:4px 0}
code{font-family:var(--mono);font-size:.86em;background:var(--plate);padding:2px 6px;border-radius:5px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--plate);color:var(--stone);margin-right:6px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--seam);margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 14px;font-size:14px;font-weight:500;color:var(--stone);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* preview */
.stage{position:relative;height:360px;border-radius:16px;background:radial-gradient(120% 90% at 50% 100%,#22221f 0%,var(--ink) 60%);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .hint{position:absolute;left:16px;bottom:14px;font-size:13px;color:#8c8a84}
.stage .replay{position:absolute;right:14px;bottom:12px;border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;background:rgba(244,242,236,.1);color:var(--plate)}
.stage .replay:hover{background:rgba(244,242,236,.18)}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;border:0;border-radius:50%;background:var(--stud-blue);display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.play:hover{background:var(--stud-blue-deep);transform:translate(-50%,-50%) scale(1.05)}
.play svg{width:28px;height:28px;fill:#fff}

/* code */
.code{position:relative;border-radius:12px;background:var(--ink);color:#e9e7e1;margin:0 0 16px}
.code pre{margin:0;padding:16px 56px 16px 18px;overflow:auto;font-family:var(--mono);font-size:13.5px;line-height:1.6;max-height:520px;tab-size:2}
.code .copy{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:8px;background:rgba(244,242,236,.08);display:grid;place-items:center}
.code .copy:hover{background:rgba(244,242,236,.16)}
.code .copy svg{width:15px;height:15px;stroke:#e9e7e1;fill:none;stroke-width:2}
.k{color:#ff7b72}.s{color:#a5d6ff}.n{color:#ffa657}.c{color:#8b949e}.f{color:#d2a8ff}

/* grid on overview */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:12px}
.card{display:block;border-radius:14px;box-shadow:0 0 0 1px var(--seam);overflow:hidden;transition:box-shadow .2s,transform .2s var(--ease)}
.card:hover{box-shadow:0 0 0 1px var(--stone-light);transform:translateY(-2px)}
.card .thumb{height:120px;background:var(--ink);position:relative}
.card .thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.card .thumb.snd{display:grid;place-items:center}
.card .thumb.snd svg{width:40px;height:40px;stroke:var(--stone-light);fill:none;stroke-width:1.6}
.card .meta{padding:12px 14px}
.card .meta small{display:block;margin-top:6px;font-size:12px;color:var(--stone-light)}
.card b{display:block;font-family:var(--mono);font-size:14px;font-weight:500}
.card span{font-size:13px;color:var(--stone)}

.pager{display:flex;justify-content:space-between;margin-top:56px;gap:12px}
.pager a{padding:10px 16px;border-radius:10px;box-shadow:0 0 0 1px var(--seam);font-size:14px;font-weight:500}
.pager a:hover{box-shadow:0 0 0 1px var(--stone-light)}

.menu{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr;gap:0;padding:0 16px}
  .side{position:static;height:auto;padding:16px 0 0;display:none}
  .side.open{display:block}
  .menu{display:inline-flex;margin-left:auto;border:0;background:var(--plate);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500}
  .top nav{display:none}
  .top-in{padding:0 16px}
  main{padding-top:24px}
  .stage{height:280px}
  h1{font-size:30px}
}

/* store effects */
.card .thumb{height:150px;background:var(--plate);display:grid;place-items:center}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card .meta span{display:block;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--plate);color:var(--stone)}
.chip.cat{background:#E8EDFF;color:var(--stud-blue-deep)}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);vertical-align:-1px;margin-right:3px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.cats button{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:var(--plate);color:var(--stone)}
.cats button.on{background:var(--ink);color:var(--white)}
.count{font-size:14px;color:var(--stone);margin:0 0 16px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 8px}
.vs > div{border-radius:14px;box-shadow:0 0 0 1px var(--seam);padding:18px}
.vs .ours{box-shadow:0 0 0 2px var(--stud-blue)}
.vs h3{margin:0 0 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--stone)}
.vs .ours h3{color:var(--stud-blue)}
.vs img{width:100%;max-width:220px;aspect-ratio:1;border-radius:10px;background:var(--plate);display:block;margin-bottom:12px}
.vs p{font-size:14px;color:var(--stone);margin:0 0 8px}
.vs .big{font-family:var(--mono);font-size:20px;color:var(--ink);margin:0 0 8px;word-break:break-all}
table.meta{width:100%;border-collapse:collapse;font-size:14px;margin:0 0 8px}
table.meta td{padding:9px 0;border-bottom:1px solid var(--seam);vertical-align:top}
table.meta td:first-child{color:var(--stone);width:170px;padding-right:16px}
.ok{color:#137333;font-weight:600}
@media (max-width:860px){.vs{grid-template-columns:1fr}table.meta td:first-child{width:120px}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="../" aria-label="Baseplate home">
      <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><circle cx="30" cy="70" r="17"/><circle cx="70" cy="70" r="17"/></g><g fill="none" stroke="currentColor" stroke-width="11"><circle cx="30" cy="30" r="11.5"/><circle cx="70" cy="30" r="11.5"/></g></svg>
      baseplate
    </a>
    <nav aria-label="Main">
      <a href="../">Home</a>
      <a class="on" href="./">Effects</a>
    </nav>
    <button class="menu" id="menu" aria-expanded="false" aria-controls="side">Menu</button>
  </div>
</header>

<div class="layout">
  <aside class="side" id="side" aria-label="Effects"></aside>
  <main id="main"><p class="lead">Loading…</p></main>
</div>

<script>
const REGISTRY = "../r/";
const ICON_COPY = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
const COLORS = { white: "#F4F4F4", red: "#E5383B", blue: "#2F6BFF", orange: "#FF8A1F", black: "#1A1A1A", grey: "#8E8E8E", yellow: "#FFD43B", green: "#2FBF5B", purple: "#8B4DFF", cyan: "#22D3EE", pink: "#FF6FB5" };
const CAT_INFO = {
  hit: "Impacts, slashes and punches", explosion: "Bursts and blasts", aura: "Glows that stay on a character", projectile: "Things that fly",
  trail: "Streaks behind movement", pickup: "Coins, gems and collectibles", celebrate: "Wins, confetti and fireworks", ambient: "Background atmosphere",
  hazard: "Lava, acid and danger zones", magic: "Spells, portals and runes", heal: "Healing and buffs", dash: "Speed and dashes",
  spawn: "Appear and teleport", death: "Defeat and disappear", weather: "Rain, snow and wind", fire: "Flames and burning", smoke: "Smoke and dust",
};

let data = null, effects = [], byName = new Map(), packCount = new Map();
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const thumb = (e) => `${REGISTRY}vfx-thumbs/${e.asset_id}.png`;
const storeUrl = (e) => `https://create.roblox.com/store/asset/${e.asset_id}`;
const kindLabel = (e) => (e.loops ? "loop" : "burst");
const swatches = (e) => e.colors.map((c) => `<span class="sw" style="background:${COLORS[c] || "#ccc"}" title="${c}"></span>`).join("");
const usage = (e) => e.loops
  ? `local stop = Juice.attach("${e.name}", part) -- stays on\n-- later:\nstop()`
  : `Juice.play("${e.name}", part) -- a BasePart, Model or Vector3`;
const findLine = (e) => `${e.name}: ${e.description} (from "${e.pack}")`;

/* ---------- Luau highlighting (just enough for our snippets) ---------- */
function highlight(src, lang) {
  if (lang === "sh") return esc(src).replace(/^(npx|claude)/gm, '<span class="f">$1</span>');
  if (lang === "text") return esc(src);
  const re = /(--[^\n]*)|("(?:[^"\\]|\\.)*")|\b(local|function|return|end|if|then|else|for|in|do|not|and|or|nil|true|false)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Z][A-Za-z0-9]+)(?=\.)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : m[4] ? "n" : "f";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const codeStore = {};
function codeBlock(src, lang = "lua") {
  const id = "c" + Math.random().toString(36).slice(2);
  codeStore[id] = src;
  return `<div class="code"><pre>${highlight(src, lang)}</pre><button class="copy" data-copy="${id}" aria-label="Copy">${ICON_COPY}</button></div>`;
}
document.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  try { await navigator.clipboard.writeText(codeStore[btn.dataset.copy]); } catch {}
  btn.innerHTML = ICON_CHECK;
  setTimeout(() => (btn.innerHTML = ICON_COPY), 1400);
});

/* ---------- pages ---------- */
const route = () => decodeURIComponent(location.hash.replace(/^#\/?/, "")) || "all";

function sidebar() {
  const r = route();
  const link = (href, text) => `<li><a href="#/${href}" class="${r === href ? "on" : ""}">${text}</a></li>`;
  const count = (c) => effects.filter((e) => e.category === c).length;
  $("#side").innerHTML =
    `<h4>Getting started</h4><ul>${link("intro", "Introduction")}${link("installation", "Installation")}${link("all", `All effects (${effects.length})`)}</ul>` +
    `<h4>Categories</h4><ul>${data.categories.filter(count).map((c) => link(`c/${c}`, `${c} <span style="color:var(--stone-light)">${count(c)}</span>`)).join("")}</ul>`;
}

function card(e) {
  return `<a class="card" href="#/e/${e.name}" data-search="${esc([e.name, e.description, e.pack, e.category, ...e.colors, ...e.layers].join(" ").toLowerCase())}">
    <div class="thumb"><img src="${thumb(e)}" alt="" loading="lazy" width="150" height="150"></div>
    <div class="meta"><b>${esc(e.name)}</b><span>${esc(e.description.replace(/ Source: .*$/, ""))}</span>
      <div class="chips"><span class="chip cat">${e.category}</span><span class="chip">${kindLabel(e)}</span><span class="chip">${e.size}</span><span class="chip">${swatches(e)}</span></div>
      <small>From "${esc(e.pack)}"</small></div></a>`;
}

function listPage(cat) {
  const list = cat ? effects.filter((e) => e.category === cat) : effects;
  return `
    <div class="crumb">Effects${cat ? " / " + cat : ""}</div>
    <h1>${cat ? cat : "All effects"}</h1>
    <p class="lead">${cat ? `${CAT_INFO[cat] || ""}. ` : ""}${list.length} effects from free Creator Store packs that passed our safety scan. Baseplate split each pack into single effects and gave every one an agent name and a plain description, so your AI finds the right one in one search.</p>
    <input class="filter" id="filter" type="search" placeholder="Filter: fire, confetti, portal, blue, loop…" aria-label="Filter effects">
    <p class="count" id="count">${list.length} effects</p>
    <div class="grid">${list.map(card).join("")}</div>`;
}

function effectPage(name) {
  const e = byName.get(name);
  if (!e) return `<h1>Not found</h1><p>No effect named <code>${esc(name)}</code>. <a href="#/all" style="text-decoration:underline">See all effects</a>.</p>`;
  const siblings = effects.filter((x) => x.asset_id === e.asset_id && x !== e);
  const dur = e.duration ? `about ${e.duration}s${e.loops ? " per cycle" : ""}` : "unknown";
  return `
    <div class="crumb"><a href="#/c/${e.category}">${e.category}</a> / ${esc(e.name)}</div>
    <h1 style="font-family:var(--mono);letter-spacing:-.02em">${esc(e.name)}</h1>
    <p class="lead">${esc(e.description.replace(/ Source: .*$/, ""))}</p>

    <div class="vs">
      <div>
        <h3>On the Creator Store</h3>
        <img src="${thumb(e)}" alt="Creator Store thumbnail for ${esc(e.pack)}">
        <p><b style="color:var(--ink)">${esc(e.pack)}</b></p>
        <p>One thumbnail for the whole pack${packCount.get(e.asset_id) > 1 ? `, which holds ${packCount.get(e.asset_id)} usable effects` : ""}. No description of what each effect looks like or where it is inside.</p>
        <p><a href="${storeUrl(e)}" target="_blank" rel="noopener" style="text-decoration:underline">View on the Creator Store</a></p>
      </div>
      <div class="ours">
        <h3>In Baseplate</h3>
        <p class="big">${esc(e.name)}</p>
        <p>${esc(e.description)}</p>
        <div class="chips" style="margin-bottom:12px"><span class="chip cat">${e.category}</span><span class="chip">${kindLabel(e)}</span><span class="chip">${e.size}</span>${e.layers.map((l) => `<span class="chip">${l}</span>`).join("")}</div>
        <p>Your AI gets this single effect, not the whole pack, and plays it by name.</p>
      </div>
    </div>

    <h2>Metadata</h2>
    <table class="meta">
      <tr><td>Agent name</td><td><code>${esc(e.name)}</code></td></tr>
      <tr><td>Category</td><td><a href="#/c/${e.category}" style="text-decoration:underline">${e.category}</a></td></tr>
      <tr><td>Element</td><td>${esc(e.element)}</td></tr>
      <tr><td>Type</td><td>${e.loops ? "Loop: stays on until you stop it" : "Burst: plays once"}</td></tr>
      <tr><td>Length</td><td>${dur}</td></tr>
      <tr><td>Size</td><td>${e.size}</td></tr>
      <tr><td>Colors</td><td>${e.colors.map((c) => `<span class="sw" style="background:${COLORS[c] || "#ccc"}"></span>${c}`).join(", ")}</td></tr>
      <tr><td>Layers</td><td>${e.layers.join(", ")}</td></tr>
      <tr><td>Particle emitters</td><td>${e.emitters}${e.fire.length ? ` (${e.fire.map((f) => `${esc(f.emitter)} ×${f.emit}`).join(", ")})` : ""}</td></tr>
      <tr><td>Safety scan</td><td><span class="ok">Passed</span>: checked for scripts and hidden code before listing. Any scripts are removed when it is added. <a href="../vfx-report.html" style="text-decoration:underline">How</a></td></tr>
      <tr><td>Pinned version</td><td>${e.pinned_version.slice(0, 10)}. <code>add_vfx</code> refuses the effect if the pack changes after this.</td></tr>
      <tr><td>Source pack</td><td><a href="${storeUrl(e)}" target="_blank" rel="noopener" style="text-decoration:underline">${esc(e.pack)}</a>, asset ${e.asset_id}${e.votes ? `, ${e.votes} votes` : ""}</td></tr>
      <tr><td>Path in pack</td><td><code>${esc(e.path)}</code></td></tr>
    </table>

    <h2>What your AI sees</h2>
    <p>One line from <code>find_vfx</code>, instead of a page of thumbnails:</p>
    ${codeBlock(findLine(e), "text")}

    <h2>Add it</h2>
    <p>Ask your AI (with Baseplate connected, see <a href="#/installation" style="text-decoration:underline">Installation</a>):</p>
    ${codeBlock(`Use baseplate to add ${e.name}`, "text")}
    <p>It calls <code>add_vfx</code>, which checks the pack is unchanged, records it in <code>vfx.json</code>, and gives your AI one snippet to run through the Roblox Studio MCP.</p>

    <h2>Use it</h2>
    ${codeBlock(`local Juice = require(game.ReplicatedStorage.Shared.Juice)\n\n${usage(e)}`)}
    ${siblings.length ? `<h2>More from this pack</h2><div class="grid">${siblings.slice(0, 6).map(card).join("")}</div>` : ""}`;
}

function introPage() {
  return `
    <div class="crumb">Docs</div>
    <h1>Introduction</h1>
    <p class="lead">The Creator Store has thousands of free effect packs, but each one is a single thumbnail and a vague title. An AI can't see thumbnails, and dropping in a whole pack to find one effect wastes tokens and can bring in hidden scripts.</p>
    <h3>What Baseplate adds</h3>
    <ul>
      <li><b>Safety scan.</b> Every pack is checked for scripts and hidden code. Only packs that pass are listed.</li>
      <li><b>Single effects.</b> Each pack is split into the effects inside it, ${effects.length} in all.</li>
      <li><b>Agent names.</b> Every effect gets a name like <code>explosion/fire</code> or <code>celebrate/confetti</code>: category, then what it is. Names never change.</li>
      <li><b>Descriptions.</b> Colors, layers, length, size and whether it loops, read from the effect's own settings.</li>
      <li><b>Pinned versions.</b> If a pack is changed on the store, Baseplate refuses it until it's scanned again.</li>
    </ul>
    <h3>Use it</h3>
    ${codeBlock(`local Juice = require(game.ReplicatedStorage.Shared.Juice)\n\nJuice.play("explosion/fire", part)\nlocal stop = Juice.attach("hazard/lava", lavaPart)`)}
    <div class="pager"><span></span><a href="#/installation">Installation →</a></div>`;
}

function installPage() {
  return `
    <div class="crumb">Docs</div>
    <h1>Installation</h1>
    <p class="lead">Connect Baseplate to your AI once. You also need the Roblox Studio MCP, so your AI can put effects into your game.</p>
    <h3>1. Connect</h3>
    ${codeBlock("claude mcp add baseplate -- npx -y baseplate-cli mcp", "sh")}
    <p>Using Codex, Cursor or another agent? <a href="../#connect" style="text-decoration:underline">See the setup for each</a>.</p>
    <h3>2. Ask</h3>
    ${codeBlock("Use baseplate to add an explosion when the rocket hits", "text")}
    <h3>3. What your AI does</h3>
    <ol>
      <li><code>find_vfx("fire explosion")</code> returns up to five agent names with descriptions.</li>
      <li><code>add_vfx(["explosion/fire"])</code> checks the pack is unchanged, adds the Juice runtime, records it in <code>vfx.json</code>, and returns one snippet.</li>
      <li>Your AI runs the snippet once through the Roblox Studio MCP. The effect is stored in <code>ReplicatedStorage.BaseplateVFX</code>, with any scripts removed.</li>
      <li>Your game plays it with <code>Juice.play("explosion/fire", part)</code>.</li>
    </ol>
    <div class="pager"><a href="#/intro">← Introduction</a><a href="#/all">All effects →</a></div>`;
}

function render() {
  sidebar();
  $("#side").classList.remove("open");
  const r = route();
  const cat = r.startsWith("c/") ? r.slice(2) : null;
  $("#main").innerHTML =
    r === "intro" ? introPage() : r === "installation" ? installPage()
    : r.startsWith("e/") ? effectPage(r.slice(2))
    : listPage(cat);
  document.title = (r.startsWith("e/") ? r.slice(2) : cat || { intro: "Introduction", installation: "Installation" }[r] || "Effects") + " · Baseplate";
  window.scrollTo(0, 0);
  const filter = $("#filter");
  if (filter) filter.oninput = () => {
    const words = filter.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let n = 0;
    document.querySelectorAll("#main > .grid > .card").forEach((c) => { c.hidden = !words.every((w) => c.dataset.search.includes(w)); if (!c.hidden) n++; });
    $("#count").textContent = `${n} effects`;
  };
}

$("#menu").onclick = () => {
  const open = $("#side").classList.toggle("open");
  $("#menu").setAttribute("aria-expanded", open);
};

fetch(REGISTRY + "vfx-effects.json")
  .then((r) => r.json())
  .then((d) => {
    data = d;
    effects = d.effects.slice().sort((a, b) => d.categories.indexOf(a.category) - d.categories.indexOf(b.category) || (b.votes || 0) - (a.votes || 0));
    for (const e of effects) { byName.set(e.name, e); packCount.set(e.asset_id, (packCount.get(e.asset_id) || 0) + 1); }
    window.addEventListener("hashchange", render);
    render();
  })
  .catch(() => ($("#main").innerHTML = "<h1>Couldn't load the effects</h1><p>Try reloading the page.</p>"));
</script>
</body>
</html>
